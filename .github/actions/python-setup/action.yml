name: Python and UV Setup

inputs:
  python-version:
    required: true
    type: string
  uv-version:
    required: true
    type: string

runs:
  using: "composite"

  steps:
    - name: Install uv ${{ inputs.uv-version }} and Python ${{ inputs.python-version }}
      uses: astral-sh/setup-uv@v5
      with:
        version: ${{ inputs.uv-version }}
        python-version: ${{ inputs.python-version }}
    - name: Install dependencies
      shell: bash
      run: uv sync --frozen
